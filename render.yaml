# Render Blueprint – Region Frankfurt (Daten bleiben in der EU)
databases:
  - name: star-style-db
    region: frankfurt
    plan: basic-256mb        # kostenpflichtig: tägliche Backups, keine automatische Löschung
    databaseName: starstyle
    postgresMajorVersion: "16"

services:
  - type: web
    name: star-style
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME          # Next.js soll auf allen Schnittstellen lauschen
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase: { name: star-style-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      # optional – leer lassen = System läuft ohne KI
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
